info:
  name: list
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/dlq/:topic?limit=20"
  params:
    - name: limit
      value: "20"
      type: query
    - name: topic
      value: scrape.record.detail
      type: path

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
