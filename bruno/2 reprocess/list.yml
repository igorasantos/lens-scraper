info:
  name: list
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/scrape/records/details"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      [
        "{{record_id}}"
      ]

runtime:
  variables:
    - name: record_id
      value: "123"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
