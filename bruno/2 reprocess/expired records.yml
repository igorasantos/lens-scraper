info:
  name: expired records
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/scrape/records/expired/reprocess"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "detail_mode": "logged-out"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
