info:
  name: pending records
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/scrape/records/pending/{{fromRunId}}/reprocess"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "recycle": false
      }

runtime:
  variables:
    - name: fromRunId
      value: 2026-00-00T00:00:00.000Z

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
