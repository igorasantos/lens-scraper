info:
  name: pending records
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/scrape/records/pending/{{fromRunId}}/reprocess"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "recycle": true,
        "dispatchCount": {{count}}
      }

runtime:
  variables:
    - name: fromRunId
      value: 2026-00-00T00:00:00.000Z
  scripts:
    - type: before-request
      code: |-
        bru.setVar("count", Math.floor(Math.random() * 13) + 3);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
